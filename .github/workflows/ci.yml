name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/InvestHorizon.sln
      - name: Build
        run: dotnet build backend/InvestHorizon.sln --no-restore -c Release
      - name: Test
        run: dotnet test backend/InvestHorizon.sln --no-build -c Release --verbosity normal

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build & start stack
        run: docker compose up -d --build
        working-directory: .
      - name: Wait for stack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && break
            sleep 2
          done
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Run Playwright
        run: npx playwright test
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Tear down
        if: always()
        run: docker compose down -v
